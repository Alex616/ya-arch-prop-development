---
# Разработчики — domain-developer ограничен своим namespace через RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-sales-binding
  namespace: sales
subjects:
  - kind: User
    name: dev-sales
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: domain-developer
  apiGroup: rbac.authorization.k8s.io

